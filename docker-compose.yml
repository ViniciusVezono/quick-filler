services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quick_filler
      POSTGRES_USER: quick_filler
      POSTGRES_PASSWORD: quick_filler
    volumes:
      - quick_filler_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quick_filler -d quick_filler"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://quick_filler:quick_filler@postgres:5432/quick_filler
      PORT: 3000
      CORS_ORIGIN: http://localhost:8080
      UPLOAD_MAX_MB: 15
      PROCESSING_CONCURRENCY: 2
      PROCESSING_TIMEOUT_MS: 120000
      RETENTION_HOURS: 24
      OCR_ENABLED: "true"
      OCR_LANGUAGE: por
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  quick_filler_postgres:
